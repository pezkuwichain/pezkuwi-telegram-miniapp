# Included inside the supabase.pezkuwichain.io server block, before `location /`,
# as /etc/nginx/snippets/pezkuwi-bots.conf. Keeps the public URLs the bots and
# callers already use, but sends these two names to the bots runtime instead of
# the shared functions gateway.
location ~ ^/functions/v1/(telegram-bot|ask)$ {
    proxy_pass http://127.0.0.1:9060/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Set, not appended: ask rate-limits on the first address in this header,
    # so a client must not be able to choose it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    client_max_body_size 1m;
}
